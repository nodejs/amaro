version: 2
updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain the Rust core. SWC publishes all of its crates from one monorepo
  # release, so they are grouped into a single pull request.
  - package-ecosystem: "cargo"
    directory: "/crates/amaro"
    schedule:
      interval: "weekly"
    groups:
      swc:
        patterns:
          - "swc_*"
      rust-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "swc_*"
